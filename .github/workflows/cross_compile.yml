name: Auto Build & Release

# 手动打 tag(如 v1.2.3 / v2026.08.17)推送时: 构建多平台二进制 + 发布 Release
# 不再随 main push 自动发版
on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: windows
            goarch: amd64
          - os: linux
            goarch: amd64
          - os: linux
            goarch: arm64

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21.1'

    - name: Compile for target
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        mkdir -p output
        if [ "$GOOS" = "windows" ]; then
          go build -ldflags="-s -w" -o output/gensokyo-${{ matrix.os }}-${{ matrix.goarch }}.exe
        else
          go build -ldflags="-s -w" -o output/gensokyo-${{ matrix.os }}-${{ matrix.goarch }}
        fi

    - name: Compress with UPX
      run: |
        # webui 已从 main.go 移除, 不再需要前端占位; 直接 -s -w + UPX 压到 ~9MB(与上游一致)
        sudo apt-get update
        sudo apt-get install -y upx-ucl 2>/dev/null || sudo apt-get install -y upx
        if [ "${{ matrix.os }}" = "windows" ]; then
          upx --best output/gensokyo-${{ matrix.os }}-${{ matrix.goarch }}.exe
        else
          upx --best output/gensokyo-${{ matrix.os }}-${{ matrix.goarch }}
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: gensokyo-${{ matrix.os }}-${{ matrix.goarch }}
        path: output/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: output

    - name: Flatten artifacts
      run: |
        # [DanielToyama] 修复: 拷到 output/release/ 而非 output/,避免二进制名(gensokyo-linux-amd64)
        # 与同名 artifact 目录冲突导致 cp 失败(错误被 2>/dev/null || true 吞掉, linux 产物丢失)
        mkdir -p output/release
        find output -type f \( -name "gensokyo-*" -o -name "gensokyo-*.exe" \) -exec cp {} output/release/ \; 2>/dev/null || true
        ls -la output/release/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        # 自动根据 tag 范围内的 commit 生成 release notes
        generate_release_notes: true
        files: |
          output/release/*
        draft: false
        prerelease: false
