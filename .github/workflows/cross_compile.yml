name: Auto Build & Release

# 手动打 tag(如 v1.2.3 / v2026.08.17)推送时: 构建多平台二进制 + 发布 Release
# 不再随 main push 自动发版
on:
  push:
    tags:
      - '*'

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: windows
            goarch: amd64
          - os: linux
            goarch: amd64
          - os: linux
            goarch: arm64

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21.1'

    - name: Compile for target
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        mkdir -p output
        if [ "$GOOS" = "windows" ]; then
          go build -ldflags="-s -w" -o output/gensokyo-${{ matrix.os }}-${{ matrix.goarch }}.exe
        else
          go build -ldflags="-s -w" -o output/gensokyo-${{ matrix.os }}-${{ matrix.goarch }}
        fi

    - name: Compress with UPX
      run: |
        # [DanielToyama] 修复 2026-08-19: 之前 sudo apt-get update 依赖 azure.archive.ubuntu.com 镜像,
        # 该镜像(微软托管 runner 专用)抽风时 apt 反复重试导致整个构建卡死; 改为直连 GitHub Release
        # 下载 UPX 二进制(走 objects.githubusercontent.com CDN, 不依赖 apt 镜像), 失败再回退 apt
        if [ "${{ matrix.os }}" = "windows" ]; then
          UPX_BIN=upx-4.2.4-win64/upx.exe
          UPX_URL=https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-win64.zip
          curl -fsSL -o /tmp/upx.zip "$UPX_URL" && (cd /tmp && unzip -o upx.zip >/dev/null)
        else
          UPX_BIN=upx-4.2.4-amd64_linux/upx
          UPX_URL=https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz
          curl -fsSL -o /tmp/upx.tar.xz "$UPX_URL" && tar -xf /tmp/upx.tar.xz -C /tmp
        fi
        if [ -x "/tmp/$UPX_BIN" ] || [ -f "/tmp/$UPX_BIN" ]; then
          if [ "${{ matrix.os }}" = "windows" ]; then
            /tmp/$UPX_BIN --best output/gensokyo-${{ matrix.os }}-${{ matrix.goarch }}.exe
          else
            chmod +x /tmp/$UPX_BIN && /tmp/$UPX_BIN --best output/gensokyo-${{ matrix.os }}-${{ matrix.goarch }}
          fi
        else
          echo "UPX 直连下载失败, 回退 apt 安装"
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y upx-ucl 2>/dev/null || sudo apt-get install -y upx
          if [ "${{ matrix.os }}" = "windows" ]; then
            upx --best output/gensokyo-${{ matrix.os }}-${{ matrix.goarch }}.exe
          else
            upx --best output/gensokyo-${{ matrix.os }}-${{ matrix.goarch }}
          fi
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: gensokyo-${{ matrix.os }}-${{ matrix.goarch }}
        path: output/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: output

    - name: Flatten artifacts
      run: |
        # [DanielToyama] 修复: 拷到 output/release/ 而非 output/,避免二进制名(gensokyo-linux-amd64)
        # 与同名 artifact 目录冲突导致 cp 失败(错误被 2>/dev/null || true 吞掉, linux 产物丢失)
        mkdir -p output/release
        find output -type f \( -name "gensokyo-*" -o -name "gensokyo-*.exe" \) -exec cp {} output/release/ \; 2>/dev/null || true
        ls -la output/release/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        # 自动根据 tag 范围内的 commit 生成 release notes
        generate_release_notes: true
        files: |
          output/release/*
        draft: false
        prerelease: false
